apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: envoy-gateway-system

resources:
  - gateway.yaml
  - gatewayclass.yaml

helmCharts:
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    releaseName: gateway-helm
    version: 1.8.3
    valuesFile: values.yaml
    namespace: envoy-gateway-system
    includeCRDs: false
