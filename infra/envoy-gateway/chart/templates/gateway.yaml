apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.gateway.clusterIssuer }}
    external-dns.alpha.kubernetes.io/provider: {{ .Values.gateway.externalDnsProvider }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      hostname: {{ .Values.gateway.hostname | quote }}
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      hostname: {{ .Values.gateway.hostname | quote }}
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.gateway.tls.secretName }}
