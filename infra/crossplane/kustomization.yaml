---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - providers.yaml

helmCharts:
  - name: crossplane
    repo: https://charts.crossplane.io/stable
    version: 2.3.3
    releaseName: crossplane
    valuesFile: values.yaml
    namespace: crossplane-system
    includeCRDs: true
