---
# Project for tenant workloads — restricts source repos and target namespaces
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tenants
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Tenant workloads — each tenant app is restricted to its own namespace"

  sourceRepos:
    - "https://github.com/lukas1102/platform-2at-gitops-gke.git"

  # Tenants may only deploy to namespaces matching tenant-* pattern
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "tenant-*"

  namespaceResourceBlacklist:
    - group: ''
      kind: ResourceQuota
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: ''
      kind: LimitRange

  clusterResourceWhitelist:
    - group: "platform.fhbgl.study"
      kind: "XTenant"

  roles:
    - name: tenant-readonly
      description: Read-only access to tenant applications
      policies:
        - p, proj:tenants:tenant-readonly, applications, get, tenants/*, allow
