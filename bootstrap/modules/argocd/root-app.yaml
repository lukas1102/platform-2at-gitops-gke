apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  source:
    repoURL: https://github.com/lukas1102/platform-2at-gitops-gke.git
    targetRevision: HEAD
    path: clusters/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Ignore status, operation, and metadata fields on child Applications
  # This prevents resourceVersion conflicts when updating Application resources
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /status
        - /operation
        - /metadata/resourceVersion
        - /metadata/generation
        - /metadata/managedFields
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
